name: Diagnostico JSX isolado
on:
  pull_request:
    branches:
      - diagnostico-jsx-main-934515
jobs:
  jsx-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build de diagnostico
        run: npm run build
