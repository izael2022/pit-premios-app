<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650">
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8bd"/><stop offset=".15" stop-color="#ffd54d"/><stop offset=".36" stop-color="#b96c0b"/><stop offset=".55" stop-color="#ffdc60"/><stop offset=".77" stop-color="#a45a08"/><stop offset="1" stop-color="#fff0a1"/></linearGradient>
